<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G.O.A.Ted Apps — Yiwen's App Directory</title>
<meta name="description" content="A directory of small apps built by Yiwen — kids' study tools, games, and everyday utilities.">

<meta property="og:title" content="G.O.A.Ted Apps">
<meta property="og:description" content="A directory of small apps built by Yiwen — kids' study tools, games, and everyday utilities.">
<meta property="og:type" content="website">
<meta property="og:image" content="images/og-image.png">

<link rel="icon" type="image/png" href="images/favicon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="backdrop" aria-hidden="true"></div>

  <header class="hero">
    <div class="brand">G.O.A.Ted<span class="dot">.</span>Apps</div>
    <div class="brand-sub">Yiwen's App Directory</div>

    <div class="terminal" role="group" aria-label="Introduction">
      <div class="terminal-bar">
        <span class="tab-dot red"></span>
        <span class="tab-dot amber"></span>
        <span class="tab-dot green"></span>
        <span class="terminal-title">yiwen@goated — zsh</span>
      </div>
      <div class="terminal-body">
        <div class="term-line" style="--delay:0s">
          <span class="prompt-user">visitor</span><span class="prompt-path">@goated</span><span class="prompt-sigil">:~$</span> whoami
        </div>
        <div class="term-line" style="--delay:0.8s">
          <span class="out">&gt; Yiwen — builds small apps for family, fun, and daily life.</span>
        </div>
        <div class="term-line" style="--delay:1.7s">
          <span class="prompt-user">visitor</span><span class="prompt-path">@goated</span><span class="prompt-sigil">:~$</span> ls categories/
        </div>
        <div class="term-line" style="--delay:2.5s">
          <span class="out-dir" id="hero-categories">kids-study/ &middot; fun-and-games/ &middot; utilities/</span>
        </div>
        <div class="term-line" style="--delay:3.4s">
          <span class="prompt-user">visitor</span><span class="prompt-path">@goated</span><span class="prompt-sigil">:~$</span> <span class="cursor" aria-hidden="true"></span>
        </div>
      </div>
    </div>
  </header>

  <main id="catalog" aria-label="App directory">
    <!-- populated by script.js from apps-data.js -->
  </main>

  <footer>
    <span class="prompt-user">yiwen@goated</span>:~$ <span aria-hidden="true">//</span> built by Yiwen and Claude. Copyright 2026.
  </footer>

  <script src="apps-data.js"></script>
  <script src="script.js"></script>
</body>
</html>
